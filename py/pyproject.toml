[project]
name = "pmv-tools"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "beat-this==1.1.0",
    "imageio-ffmpeg>=0.8.1",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
